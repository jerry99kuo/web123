<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Geister 殘局解謎</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #131312d3;
            color: #bababa;
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center;
        }

        .game-container {
            display: flex; 
            gap: 100px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .sidebar { 
            display: flex; 
            flex-direction: 
            column; 
            gap: 24px; 
            width: 320px; 
        }
        
        .header-section { 
            border-bottom: 1px solid #403d39; 
            padding-bottom: 15px; 
        }

        h2 { 
            font-size: 28px; 
            font-weight: 600; 
            color: #ffffff; 
            margin-bottom: 8px;
        }

        .tagline { 
            font-size: 14px; 
            color: #8e8e8e; 
            line-height: 1.5; 
        }
        
        .control-group { display: flex; flex-direction: column; gap: 10px; }
        label { font-size: 12px; color: #8e8e8e; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }

        select, button { 
            padding: 14px; border-radius: 4px; font-size: 15px; cursor: pointer; 
            transition: background-color 0.2s, border-color 0.2s; 
            font-family: inherit;
        }
        select { 
            background: #1e1d1a; color: #eee; border: 1px solid #403d39; outline: none;
        }
        select:focus { border-color: #629924; }

        button.action-btn { 
            background: #81b64c; 
            color: white; 
            border: none; 
            font-weight: 600; 
            text-shadow: 0 1px 1px rgba(0,0,0,0.3); 
        }

        button.action-btn:hover { background: #8bc253; }
        button.secondary-btn { background: #3c3a36; color: #cfcfcf; border: none; font-weight: 600;}
        button.secondary-btn:hover { background: #4a4843; color: white;}

        /* 狀態列 */
        .status-box { background: #1e1d1a; padding: 15px; border-radius: 4px; border-left: 4px solid #81b64c; }
        #puzzleTitle { font-size: 16px; font-weight: 600; margin-bottom: 5px; color: #ffffff; }
        #statusMessage { font-size: 14px; color: #bababa; line-height: 1.5; }

        #solutionBox { display: none; padding: 15px; background: #1e1d1a; border-radius: 4px; font-size: 14px; color: #81b64c; line-height: 1.6; border: 1px solid #333;}

        /* 星星評分面板 */
        .rating-box {
            display: none; background: #2a2212; padding: 20px; 
            border-radius: 4px; border-left: 4px solid #f5a623; text-align: center;
        }
        .rating-box h4 { font-size: 14px; color: #f5a623; margin-bottom: 12px; }
        .stars { display: flex; justify-content: center; gap: 4px; font-size: 24px; cursor: pointer; }
        .star { color: #555; transition: color 0.1s; }
        .star:hover { color: #f5a623; }
        .star.active { color: #f5a623; }

        /* 4. 棋盤區塊 (改成國際象棋雙色格) */
        .board-wrapper {
            position: relative;
            background: #1e1d1a; padding: 16px; border-radius: 4px;
            border: 1px solid #403d39;
            /* 給脫逃點預留空間 */
            margin: 20px;
        }
        
        .board { 
            display: grid; grid-template-columns: repeat(6, 100px); grid-template-rows: repeat(6, 100px);
            /* 去除 gap，讓格子緊密相連 */
            border: 2px solid #161512;
        }
        
        .cell { 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; position: relative;
        }

        /* 淺色格 */
        .cell:nth-child(odd) { background-color: #ebecd0; }
        /* 偶數列的淺色格會錯位，所以要調整 */
        .board > .cell:nth-child(12n + 1),
        .board > .cell:nth-child(12n + 3),
        .board > .cell:nth-child(12n + 5),
        .board > .cell:nth-child(12n + 8),
        .board > .cell:nth-child(12n + 10),
        .board > .cell:nth-child(12n + 12) { background-color: #ebecd0; }
        
        /* 深色格 (經典綠色版) */
        .cell:nth-child(even) { background-color: #739552; }
        .board > .cell:nth-child(12n + 2),
        .board > .cell:nth-child(12n + 4),
        .board > .cell:nth-child(12n + 6),
        .board > .cell:nth-child(12n + 7),
        .board > .cell:nth-child(12n + 9),
        .board > .cell:nth-child(12n + 11) { background-color: #739552; }

        /* 選中狀態 - 使用半透明黃色覆蓋 */
        .selected::before { 
            content: ''; position: absolute; inset: 0; 
            background-color: rgba(246, 246, 105, 0.5); z-index: 5;
        }
        
        /* 可以移動的目標提示 */
        .cell:hover::after {
            content: ''; 
            position: absolute; 
            inset: 0;
            border: 4px solid rgba(255, 255, 255, 0.4); z-index: 6;
        }

        /* 5. 外部脫逃傳送門設計 - 改為專業標記 */
        .escape-portal {
            position: absolute; width: 60px; height: 80px; 
            background: #2a2212; border: 2px dashed #f5a623; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; 
            font-size: 13px; font-weight: bold; color: #f5a623;
            cursor: pointer; transition: all 0.2s; opacity: 0.6;
        }
        .escape-portal:hover { background: #3d3119; opacity: 1; }
        
        .portal-tl { left: -76px; top: 16px; }
        .portal-tr { right: -76px; top: 16px; }
        .portal-bl { left: -76px; bottom: 16px; }
        .portal-br { right: -76px; bottom: 16px; }

        /* 6. 幽靈棋子 - 改為扁平化棋子風格 */
        .ghost {
            width: 50px; height: 60px; 
            background: #ffffff; /* 藍方為白棋 */
            border-radius: 25px 25px 5px 5px; position: relative; 
            display: flex; justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            z-index: 10;
        }
        
        /* 區分敵我：紅方使用深灰/黑色棋子 */
        .player-red .ghost { background: #2c2c2c; }

        /* 眼睛設計 */
        .ghost::before, .ghost::after {
            content: ''; position: absolute; top: 20px; width: 6px; height: 6px; 
            border-radius: 50%;
        }
        .player-blue .ghost::before, .player-blue .ghost::after { background: #161512; }
        .player-red .ghost::before, .player-red .ghost::after { background: #d64f4f; } /* 紅方紅眼 */
        
        .ghost::before { left: 14px; } 
        .ghost::after { right: 14px; }

        /* 標示好/壞鬼的點點 - 改放在胸前像徽章 */
        .dot { 
            width: 12px; height: 12px; border-radius: 50%; 
            position: absolute; bottom: 12px; 
            border: 2px solid rgba(255,255,255,0.8); 
        }
        .player-red .dot { border-color: rgba(0,0,0,0.5); }
        
        .good-dot { background-color: #81b64c; } /* 好鬼用綠色 */
        .bad-dot { background-color: #d64f4f; }  /* 壞鬼用紅色 */
        .unknown-dot { display: none; }
    </style>
</head>
<body>

<div class="game-container">
    <div class="sidebar">
        <div class="header-section">
            <h2>Geister Tactics</h2>
            <p class="tagline">Endgame Puzzle Trainer</p>
        </div>
        
        <div class="control-group">
            <label>Select Puzzle</label>
            <select id="puzzleSelect"></select>
            <button class="action-btn" onclick="loadSelectedPuzzle()">Load Puzzle</button>
        </div>

        <div class="status-box">
            <div id="puzzleTitle">Connecting...</div>
            <div id="statusMessage">Attempting to reach puzzle database.</div>
        </div>

        <button class="secondary-btn" onclick="showSolution()">Show Solution</button>
        <div id="solutionBox"></div>

        <div class="rating-box" id="ratingBox">
            <h4>Rate this puzzle</h4>
            <div class="stars">
                <span class="star" data-value="1" onclick="submitRating(1)">★</span>
                <span class="star" data-value="2" onclick="submitRating(2)">★</span>
                <span class="star" data-value="3" onclick="submitRating(3)">★</span>
                <span class="star" data-value="4" onclick="submitRating(4)">★</span>
                <span class="star" data-value="5" onclick="submitRating(5)">★</span>
            </div>
            <p id="ratingThanks" style="display:none; font-size:12px; color:#81b64c; margin-top:10px;">Rating submitted.</p>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="escape-portal portal-tl" onclick="handleCellClick(0, -1, this)">EXIT</div>
        <div class="escape-portal portal-tr" onclick="handleCellClick(0, 6, this)">EXIT</div>
        <div class="escape-portal portal-bl" onclick="handleCellClick(5, -1, this)">EXIT</div>
        <div class="escape-portal portal-br" onclick="handleCellClick(5, 6, this)">EXIT</div>

        <div class="board" id="chessBoard"></div>
    </div>
</div>

<script>
    let selectedCell = null;
    let currentPuzzleId = null;

    async function initPuzzles() {
        try {
            const response = await fetch("/api/chess/puzzles");
            const data = await response.json();
            const selectBox = document.getElementById("puzzleSelect");
            selectBox.innerHTML = ""; 

            if (!data.puzzles || data.puzzles.length === 0) {
                selectBox.innerHTML = `<option value="">No puzzles found...</option>`;
                document.getElementById("puzzleTitle").innerText = "Empty Database";
                document.getElementById("statusMessage").innerText = "Please upload puzzles via API.";
                return;
            }

            data.puzzles.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p.id;
                opt.innerText = p.title;
                selectBox.appendChild(opt);
            });
            loadSelectedPuzzle();
        } catch (error) {
            document.getElementById("puzzleTitle").innerText = "Connection Failed";
            document.getElementById("statusMessage").innerText = "Unable to connect to database.";
        }
    }

    async function loadSelectedPuzzle() {
        const selectBox = document.getElementById("puzzleSelect");
        if (!selectBox.value) return; 

        currentPuzzleId = selectBox.value;
        document.getElementById("solutionBox").style.display = "none";
        document.getElementById("ratingBox").style.display = "none";
        document.getElementById("ratingThanks").style.display = "none";
        resetStars();

        await fetch(`/api/chess/load_puzzle/${currentPuzzleId}`, { method: "POST" });
        fetchBoard();
    }

    async function fetchBoard() {
        const response = await fetch(`/api/chess/board?player=blue`);
        const data = await response.json();
        
        document.getElementById("puzzleTitle").innerText = data.puzzle_title;
        const statusMsg = document.getElementById("statusMessage");
        statusMsg.innerText = data.message;
        
        if (data.status === "solved") {
            statusMsg.style.color = "#81b64c";
            document.getElementById("ratingBox").style.display = "block";
        } else if (data.status === "failed") {
            statusMsg.style.color = "#d64f4f";
            document.getElementById("ratingBox").style.display = "block";
        } else {
            statusMsg.style.color = "#bababa";
        }
        
        const boardContainer = document.getElementById("chessBoard");
        boardContainer.innerHTML = ""; 

        for (let r = 0; r < 6; r++) {
            for (let c = 0; c < 6; c++) {
                const piece = data.board[r][c];
                const cell = document.createElement("div");
                cell.className = "cell";
                cell.dataset.row = r;
                cell.dataset.col = c;

                if (piece) {
                    cell.classList.add(`player-${piece.player}`);
                    const ghostDiv = document.createElement("div");
                    ghostDiv.className = "ghost";
                    
                    const dot = document.createElement("div");
                    dot.className = "dot";
                    if (piece.type === "good") dot.classList.add("good-dot");
                    else if (piece.type === "bad") dot.classList.add("bad-dot");
                    else dot.classList.add("unknown-dot");
                    
                    ghostDiv.appendChild(dot);
                    cell.appendChild(ghostDiv);
                }

                cell.onclick = () => handleCellClick(r, c, cell);
                boardContainer.appendChild(cell);
            }
        }

        if (data.status === 'playing' && data.turn === 'red') {
            setTimeout(async () => {
                await fetch("/api/chess/auto_move", { method: "POST" });
                fetchBoard(); 
            }, 800);
        }
    }

    async function handleCellClick(row, col, cellElement) {
        if (selectedCell === null) {
            selectedCell = { row, col };
            cellElement.classList.add("selected");
        } else {
            const moveData = {
                from_row: selectedCell.row,
                from_col: selectedCell.col,
                to_row: row,
                to_col: col,
                player: "blue"
            };

            document.querySelectorAll('.cell, .escape-portal').forEach(c => c.classList.remove('selected'));
            selectedCell = null;

            const response = await fetch("/api/chess/move", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(moveData)
            });

            if (!response.ok) {
                const errResult = await response.json();
                document.getElementById("statusMessage").innerText = "⚠ " + errResult.message;
                document.getElementById("statusMessage").style.color = "#d64f4f";
                return;
            }
            
            fetchBoard(); 
        }
    }

    async function showSolution() {
        if (!currentPuzzleId) return;
        const response = await fetch(`/api/chess/solution/${currentPuzzleId}`);
        const data = await response.json();
        const solBox = document.getElementById("solutionBox");
        solBox.style.display = "block";
        if (data.solution === "no solution") {
            solBox.innerHTML = "<strong>Evaluation:</strong><br><span style='color:#d64f4f;'>Objective is unreachable.</span>";
        } else {
            solBox.innerHTML = "<strong>Best Engine Move:</strong><br>" + data.solution.split("   ").join("<br>");
        }
    }

    function resetStars() {
        document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
    }

    async function submitRating(score) {
        const stars = document.querySelectorAll('.star');
        stars.forEach((s, idx) => {
            if (idx < score) s.classList.add('active');
            else s.classList.remove('active');
        });
        await fetch("/api/chess/rate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ puzzle_id: currentPuzzleId.toString(), rating: score })
        });
        document.getElementById("ratingThanks").style.display = "block";
    }

    initPuzzles();
</script>
</body>
</html>
